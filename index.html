<!DOCTYPE html>
<html>
<head>
    <title>出欠回答フォーム</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
    <script src="https://static.line-scdn.net/liff/sdk/2.2.0/liff.js"></script>
    <style>
        body { padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .field:not(:last-child ) { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title has-text-centered">出欠回答フォーム</h1>
        <form id="attendanceForm">
            <div class="field">
                <label class="label">お名前</label>
                <div class="control">
                    <div class="select is-fullwidth">
                        <select id="memberSelect" required>
                            <option value="">データを読み込み中...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label">例会</label>
                <div class="control">
                    <div class="select is-fullwidth">
                        <select id="eventSelect" required>
                            <option value="">データを読み込み中...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label">出欠</label>
                <div class="control">
                    <label class="radio">
                        <input type="radio" name="attendance" value="出席" required> 出席
                    </label>
                    <label class="radio">
                        <input type="radio" name="attendance" value="欠席"> 欠席
                    </label>
                </div>
            </div>

            <div class="field">
                <label class="label">コメント (任意)</label>
                <div class="control">
                    <textarea class="textarea" id="comment" placeholder="コメントがあれば入力してください"></textarea>
                </div>
            </div>

            <div class="field is-grouped is-grouped-centered">
                <div class="control">
                    <button type="submit" class="button is-primary">送信</button>
                </div>
            </div>
        </form>
        <div id="responseMessage" class="notification is-hidden"></div>
    </div>

    <script>
        const LIFF_ID = '2010278029-OUdZ7T31'; // 正しいLIFF ID
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbza-3lFkkI0NZNBH7cXcocoAh4dAaFDCfVesmMZfY9cc54lUwERv4RZLgkeQ5JbH43p/exec'; // 新しいGASウェブアプリのURL

        async function initializeLiff( ) {
            // まず先にスプレッドシートからマスターデータを取得して表示する
            await fetchMasterData();

            try {
                await liff.init({
                    liffId: LIFF_ID
                });
                console.log('LIFF initialized successfully');
                if (!liff.isLoggedIn()) {
                    // LINEアプリ外で開かれた場合は、ログインを促すか、あるいはそのまま入力を許可する
                    console.log('User is not logged in to LINE');
                }
            } catch (err) {
                console.error('LIFF initialization failed', err);
                // LINE外ブラウザでの表示用：警告はコンソールにのみ出し、画面には表示しない（ユーザーの混乱を防ぐため）
            }
        }

        async function fetchMasterData() {
            try {
                const response = await fetch(`${GAS_WEB_APP_URL}?action=getMasterData`);
                const data = await response.json();

                const memberSelect = document.getElementById('memberSelect');
                memberSelect.innerHTML = '<option value="">選択してください</option>';
                data.members.forEach(member => {
                    const option = document.createElement('option');
                    option.value = member.memberId;
                    option.textContent = member.memberName;
                    memberSelect.appendChild(option);
                });

                const eventSelect = document.getElementById('eventSelect');
                eventSelect.innerHTML = '<option value="">選択してください</option>';
                data.events.forEach(event => {
                    const option = document.createElement('option');
                    option.value = event.eventId;
                    option.textContent = `${event.eventDate} ${event.eventName}`;
                    eventSelect.appendChild(option);
                });

            } catch (error) {
                console.error('Failed to fetch master data', error);
                document.getElementById('responseMessage').textContent = 'マスターデータの取得に失敗しました。インターネット接続やGASの設定を確認してください。';
                document.getElementById('responseMessage').classList.remove('is-hidden', 'is-success', 'is-warning');
                document.getElementById('responseMessage').classList.add('is-danger');
            }
        }

        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const memberSelect = document.getElementById('memberSelect');
            const eventSelect = document.getElementById('eventSelect');
            const attendance = document.querySelector('input[name="attendance"]:checked');
            const comment = document.getElementById('comment');
            const responseMessage = document.getElementById('responseMessage');

            if (!memberSelect.value || !eventSelect.value || !attendance) {
                responseMessage.textContent = '全ての必須項目を入力してください。';
                responseMessage.classList.remove('is-hidden', 'is-success', 'is-warning');
                responseMessage.classList.add('is-danger');
                return;
            }

            // LINEのユーザーIDを取得（LINE外ブラウザの場合は 'browser_user' とする）
            let userId = 'browser_user';
            let idToken = '';
            try {
                if (liff.isLoggedIn()) {
                    userId = liff.getContext().userId;
                    idToken = liff.getIDToken();
                }
            } catch (err) {
                console.log('Not in LIFF environment');
            }

            const formData = new FormData();
            formData.append('action', 'recordAttendance');
            formData.append('userId', userId);
            formData.append('memberId', memberSelect.value);
            formData.append('memberName', memberSelect.options[memberSelect.selectedIndex].textContent);
            formData.append('eventId', eventSelect.value);
            formData.append('eventName', eventSelect.options[eventSelect.selectedIndex].textContent);
            formData.append('attendance', attendance.value);
            formData.append('comment', comment.value);
            formData.append('idToken', idToken);

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.status === 'success') {
                    responseMessage.textContent = '出欠回答を送信しました。';
                    responseMessage.classList.remove('is-hidden', 'is-danger', 'is-warning');
                    responseMessage.classList.add('is-success');

                    // LINE内であればメッセージを送信して閉じる
                    try {
                        if (liff.isInClient()) {
                            await liff.sendMessages([{
                                type: 'text',
                                text: `出欠情報を記録しました：\n例会：${eventSelect.options[eventSelect.selectedIndex].textContent}\n氏名：${memberSelect.options[memberSelect.selectedIndex].textContent}\n出欠：${attendance.value}`
                            }]);
                            liff.closeWindow();
                        }
                    } catch (lineErr) {
                        console.error('Failed to send LINE message', lineErr);
                    }
                } else {
                    responseMessage.textContent = `送信に失敗しました: ${result.message}`;
                    responseMessage.classList.remove('is-hidden', 'is-success', 'is-warning');
                    responseMessage.classList.add('is-danger');
                }
            } catch (error) {
                console.error('Error submitting form', error);
                responseMessage.textContent = 'フォームの送信中にエラーが発生しました。';
                responseMessage.classList.remove('is-hidden', 'is-success', 'is-warning');
                responseMessage.classList.add('is-danger');
            }
        });

        initializeLiff();
    </script>
</body>
</html>
